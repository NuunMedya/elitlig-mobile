name: Build APK

on:
  workflow_dispatch:   # elle tetikleme butonu
  push:
    branches: [main]
  pull_request:        # PR'daki her gönderimde deneme APK'sı

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Prebuild (generate android project)
        run: npx expo prebuild -p android --clean

      # Expo'nun ürettiği gradle.properties 512 MB Metaspace verir; derleme
      # "OutOfMemoryError: Metaspace" ile takılıp 6 saat sonra iptal oluyordu.
      - name: Raise Gradle and Kotlin memory limits
        run: |
          cd android
          sed -i '/^org.gradle.jvmargs=/d;/^kotlin.daemon.jvmargs=/d' gradle.properties
          echo 'org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError' >> gradle.properties
          echo 'kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g' >> gradle.properties

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
